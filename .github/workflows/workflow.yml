name: Build docker image

on:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  BASE_IMAGE_REVISION: 2.19.1
  ZOOKEEPER39: '3.9.6'

jobs:
  zookeeper39-build:
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        env:
          ZOO_VER: ${{ env.ZOOKEEPER39 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          make push
  zookeeper39-push:
    runs-on: ubuntu-latest
    needs:
      - zookeeper39-build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.ZOOKEEPER39 }}
          latest: true
          latest_major: true

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ zookeeper39-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6866a90de9b5966fa6aab7a224d7c7b82103f5bd
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
